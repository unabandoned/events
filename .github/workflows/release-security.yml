name: release-security

# CVE fast-path: when a Renovate vulnerability-fix PR (labelled `security`)
# is merged, cut an out-of-cycle release immediately instead of waiting for
# the monthly release-cut.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  security-release:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the release PR so it includes the security fix
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.PAT }}
      - name: Cut an out-of-cycle release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --search 'label:"autorelease: pending" state:open' --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "Security fix merged; cutting out-of-cycle release PR #$pr"
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --admin
          else
            echo "No pending release PR to cut."
          fi
